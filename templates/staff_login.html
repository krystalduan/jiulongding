<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLD Staff Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staff-login.css') }}">
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-name">JiuLongDing</div>
            <div class="brand-sub">Staff Portal</div>
        </div>

        <h2>Sign in</h2>
        <p class="form-description">Enter your staff password to access the dashboard.</p>

        <form action="/staff/login" method="post">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter staff password" required autofocus>
            </div>
            <button type="submit" class="login-btn">Sign in</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="back-link">
            <a href="/">Back to customer booking</a>
        </div>
    </div>
</body>
</html>
