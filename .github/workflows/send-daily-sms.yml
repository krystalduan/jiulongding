name: Send day-of reservation SMS

# Day-of reminder texts at 08:30 Sydney. Cron is UTC with no DST, so it runs
# at 21:30 and 22:30 UTC and the endpoint ignores whichever is too early.

on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  send-sms:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger day-of SMS
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not set - aborting."
            exit 1
          fi

          echo "Sydney time now: $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M %Z')"

          # manual runs send straight away
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE="&force=1"
            echo "Manual run: bypassing the send window."
          fi

          # retry - Fly cold starts can be slow
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            code=$(curl -sS --max-time 120 -o response.json -w '%{http_code}' \
              "https://jiulongding.au/api/send-sms-cron?secret=${CRON_SECRET}${FORCE}") && rc=0 || rc=$?

            if [ "${rc:-0}" -eq 0 ] && [ "$code" = "200" ]; then
              echo "OK:"
              cat response.json
              exit 0
            fi

            echo "Attempt $attempt failed (curl rc=${rc:-0}, http=$code)"
            [ -s response.json ] && cat response.json
            sleep 20
          done

          echo "All attempts failed - day-of SMS may not have been sent."
          exit 1
