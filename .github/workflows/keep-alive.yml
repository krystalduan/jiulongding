name: Keep app warm

# Keeps the Fly machine warm during opening hours so customers don't hit a cold start.

on:
  schedule:
    # every 15 min, 10:00-22:00 Sydney
    - cron: '*/15 23,0-11 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          echo "Pinging at $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M %Z')"
          curl -fsS --max-time 60 https://jiulongding.au/health && echo " - OK"
